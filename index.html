<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo Privato</title>
  <!-- SDK di Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .hidden {
      display: none !important;
    }
    .box {
      background: #181818;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      padding: 10px;
      background: #1db954;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    .control-btn {
      flex: 1;
      min-width: 110px;
      font-size: 0.85rem;
    }
    .active-mode {
      border: 2px solid #ffffff !important;
      box-shadow: 0 0 8px #1db954;
    }
  </style>
</head>
<body>

  <div class="box">
    <!-- Sezione Login -->
    <div id="login-box">
      <h2 style="color: #1db954; text-align: center; margin-top: 0;">Accesso Riservato</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()" style="width: 100%;">Accedi</button>
      <p id="error-msg" style="color: #ff4d4d; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- Sezione Player e Catalogo -->
    <div id="player-box" class="hidden">
      <h2 style="color: #1db954; text-align: center; margin-top: 0;">Catalogo Privato</h2>
      <p style="text-align: center; color: #ccc; margin-bottom: 20px;">
        Benvenuto! Accesso autorizzato.<br>L'ascolto è consentito solo agli utenti registrati.
      </p>

      <!-- Menu a tendina per l'alberatura (Filtri a cascata) -->
      <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
        <select id="filter-language" onchange="updateGenres()">
          <option value="">Tutte le Lingue</option>
        </select>
        <select id="filter-genre" onchange="updateArtists()" disabled>
          <option value="">Tutti i Generi</option>
        </select>
        <select id="filter-artist" onchange="renderTracks()" disabled>
          <option value="">Tutti gli Artisti</option>
        </select>
      </div>

      <!-- Lista dei brani -->
      <div id="track-list"></div>

      <!-- Menu a Tasti Avanzato al termine della lista -->
      <div style="margin-top: 25px; border-top: 1px solid #333; padding-top: 20px;">
        <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 10px; text-align: center;">Pannello di Controllo Player</p>
        
        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
          <button onclick="stopAllTracks()" class="control-btn" style="background: #e74c3c;">⏹ Stop</button>
          <button onclick="setMode('playAll')" id="btn-playAll" class="control-btn" style="background: #2c3e50;">▶ Play ALL</button>
          <button onclick="setMode('random')" id="btn-random" class="control-btn" style="background: #8e44ad;">🔀 Random</button>
          <button onclick="toggleMode('listaTop')" id="btn-listaTop" class="control-btn" style="background: #d35400;">⭐ Lista Top</button>
          <button onclick="toggleMode('repeat')" id="btn-repeat" class="control-btn" style="background: #16a085;">🔁 Repeat</button>
        </div>

        <div>
          <button onclick="startPlaySong()" style="width: 100%; background: #1db954; padding: 12px; font-size: 1rem;">▶ Play Song (Avvia)</button>
        </div>
      </div>

      <button onclick="logout()" style="width: 100%; background: #333; margin-top: 20px;">Esci</button>
    </div>
  </div>

  <script>

// Sostituisci qui con le tue chiavi prese da Settings > API su Supabase
    const SUPABASE_URL = 'https://srymbehnppgvxjnithbj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TJ9gHfCbw09uNbT46xDByg_xluGQ1f6';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allTracks = [];
    let currentMode = 'playAll'; // Modalità predefinita
    let activeFiltersMode = {
      listaTop: false,
      repeat: false
    };

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      errorMsg.innerText = '';

      const { data: { user }, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.innerText = 'Credenziali non valide.';
        return;
      }

      const { data: profile, error: profileError } = await supabaseClient
        .from('profiles')
        .select('status')
        .eq('id', user.id)
        .single();

      if (profileError || !profile || profile.status !== 'approved') {
        errorMsg.innerText = 'Account non ancora approvato dall\'amministratore.';
        await supabaseClient.auth.signOut();
        return;
      }

      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('player-box').classList.remove('hidden');
      
      loadTracks();
    }

    async function loadTracks() {
      const trackList = document.getElementById('track-list');
      trackList.innerHTML = '<p>Caricamento brani...</p>';

      const { data: tracks, error } = await supabaseClient
        .from('tracks')
        .select('*')
        .order('title', { ascending: true });

      if (error || !tracks || tracks.length === 0) {
        trackList.innerHTML = '<p style="color: #aaa; text-align: center;">Nessun brano ancora presente.</p>';
        return;
      }

      allTracks = tracks;
      populateLanguages();
      renderTracks();
    }

    function populateLanguages() {
      const langSelect = document.getElementById('filter-language');
      const languages = [...new Set(allTracks.map(t => t.lingua).filter(Boolean))].sort();
      
      langSelect.innerHTML = '<option value="">Tutte le Lingue</option>';
      languages.forEach(lang => {
        langSelect.innerHTML += `<option value="${lang}">${lang}</option>`;
      });
      
      updateGenres();
    }

    function updateGenres() {
      const selectedLang = document.getElementById('filter-language').value;
      const genreSelect = document.getElementById('filter-genre');
      
      const filtered = selectedLang ? allTracks.filter(t => t.lingua === selectedLang) : allTracks;
      const genres = [...new Set(filtered.map(t => t.genere).filter(Boolean))].sort();

      genreSelect.innerHTML = '<option value="">Tutti i Generi</option>';
      genres.forEach(genre => {
        genreSelect.innerHTML += `<option value="${genre}">${genre}</option>`;
      });

      genreSelect.disabled = genres.length === 0;
      document.getElementById('filter-artist').innerHTML = '<option value="">Tutti gli Artisti</option>';
      document.getElementById('filter-artist').disabled = true;

      renderTracks();
    }

    function updateArtists() {
      const selectedLang = document.getElementById('filter-language').value;
      const selectedGenre = document.getElementById('filter-genre').value;
      const artistSelect = document.getElementById('filter-artist');
      
      let filtered = allTracks;
      if (selectedLang) filtered = filtered.filter(t => t.lingua === selectedLang);
      if (selectedGenre) filtered = filtered.filter(t => t.genere === selectedGenre);

      const artists = [...new Set(filtered.map(t => t.artista).filter(Boolean))].sort();

      artistSelect.innerHTML = '<option value="">Tutti gli Artisti</option>';
      artists.forEach(artist => {
        artistSelect.innerHTML += `<option value="${artist}">${artist}</option>`;
      });

      artistSelect.disabled = artists.length === 0;

      renderTracks();
    }

    function renderTracks() {
      const selectedLang = document.getElementById('filter-language').value;
      const selectedGenre = document.getElementById('filter-genre').value;
      const selectedArtist = document.getElementById('filter-artist').value;
      const trackList = document.getElementById('track-list');

      let filtered = allTracks;
      if (selectedLang) filtered = filtered.filter(t => t.lingua === selectedLang);
      if (selectedGenre) filtered = filtered.filter(t => t.genere === selectedGenre);
      if (selectedArtist) filtered = filtered.filter(t => t.artista === selectedArtist);

      if (filtered.length === 0) {
        trackList.innerHTML = '<p style="color: #aaa; text-align: center;">Nessun brano corrisponde ai filtri selezionati.</p>';
        return;
      }

      trackList.innerHTML = '';

      for (let i = 0; i < filtered.length; i++) {
        const track = filtered[i];
        const { data } = supabaseClient.storage.from('wish-music-75-files').getPublicUrl(track.file_key);

        // Generazione HTML dei checkbox condizionali in base ai tasti attivi
        let checkboxesHtml = '';
        if (activeFiltersMode.listaTop) {
          checkboxesHtml += `<label style="font-size: 0.8rem; color: #d35400; margin-right: 15px;"><input type="checkbox" class="top-checkbox" data-index="${i}" checked> Lista Top</label>`;
        }
        if (activeFiltersMode.repeat) {
          checkboxesHtml += `<label style="font-size: 0.8rem; color: #16a085;"><input type="checkbox" class="repeat-checkbox" data-index="${i}" checked> Repeat</label>`;
        }

        const trackCard = document.createElement('div');
        trackCard.style.cssText = 'background: #2a2a2a; padding: 15px; border-radius: 6px; margin-bottom: 15px;';
        trackCard.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px;">
            <h4 style="margin: 0; color: #ffffff; font-size: 1.1rem;">${track.title}</h4>
            <span style="font-size: 0.75rem; background: #333; color: #1db954; padding: 2px 8px; border-radius: 10px;">${track.genere || 'Generico'} (${track.lingua || 'N/D'})</span>
          </div>
          <p style="margin: 0 0 8px 0; font-size: 0.85rem; color: #1db954; font-weight: bold;">${track.artista || 'Artista non specificato'}</p>
          <p style="margin: 0 0 10px 0; font-size: 0.85rem; color: #ccc;">${track.description || ''}</p>
          ${checkboxesHtml ? `<div style="margin-bottom: 8px;">${checkboxesHtml}</div>` : ''}
          <audio controls controlsList="nodownload" oncontextmenu="return false;" style="width: 100%;" data-index="${i}">
            <source src="${data.publicUrl}" type="audio/mpeg">
            Il tuo browser non supporta l'elemento audio.
          </audio>
        `;
        trackList.appendChild(trackCard);
      }
      updateModeUI();
    }

    function setMode(mode) {
      currentMode = mode;
      updateModeUI();
    }

    function toggleMode(modeName) {
      activeFiltersMode[modeName] = !activeFiltersMode[modeName];
      renderTracks(); // Ridisegna per mostrare/nascondere i checkbox
    }

    function updateModeUI() {
      // Gestione evidenziazione pulsanti modalità
      ['playAll', 'random'].forEach(m => {
        const btn = document.getElementById(`btn-${m}`);
        if (btn) {
          if (currentMode === m) {
            btn.classList.add('active-mode');
          } else {
            btn.classList.remove('active-mode');
          }
        }
      });

      ['listaTop', 'repeat'].forEach(m => {
        const btn = document.getElementById(`btn-${m}`);
        if (btn) {
          if (activeFiltersMode[m]) {
            btn.classList.add('active-mode');
          } else {
            btn.classList.remove('active-mode');
          }
        }
      });
    }

    function stopAllTracks() {
      const audioElements = document.querySelectorAll('audio');
      audioElements.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
      });
    }

    // Funzione Play Song principale basata sui tasti attivi e checkbox
    function startPlaySong() {
      stopAllTracks();

      const audioElements = Array.from(document.querySelectorAll('audio'));
      if (audioElements.length === 0) return;

      // Filtra i brani in base alle condizioni attive dei checkbox
      let targetAudios = audioElements.filter(audio => {
        const index = audio.getAttribute('data-index');
        
        if (activeFiltersMode.listaTop) {
          const topCheck = document.querySelector(`.top-checkbox[data-index="${index}"]`);
          if (topCheck && !topCheck.checked) return false;
        }

        if (activeFiltersMode.repeat) {
          const repeatCheck = document.querySelector(`.repeat-checkbox[data-index="${index}"]`);
          if (repeatCheck && !repeatCheck.checked) return false;
        }

        return true;
      });

      if (targetAudios.length === 0) {
        alert("Nessun brano selezionato soddisfa i filtri attivi (Lista Top / Repeat).");
        return;
      }

      // Se la modalità è Random, mescola l'array dei brani filtrati
      if (currentMode === 'random') {
        targetAudios.sort(() => Math.random() - 0.5);
      }

      let currentIndex = 0;

      function playNextInQueue() {
        if (currentIndex < targetAudios.length) {
          const currentAudio = targetAudios[currentIndex];
          
          currentAudio.onended = function() {
            currentIndex++;
            playNextInQueue();
          };

          currentAudio.play().catch(e => {
            console.log("Riproduzione automatica bloccata dal browser:", e);
          });
        }
      }

      playNextInQueue();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('player-box').classList.remove('hidden');
    }
  </script>
</body>
</html>
