<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo Privato</title>
  <!-- SDK di Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Configurazione globale per coprire tutto lo schermo con la GIF animata */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(18, 18, 18, 0.75), rgba(18, 18, 18, 0.85)), 
                  url('https://srymbehnppgvxjnithbj.supabase.co/storage/v1/object/public/wish-music-75-files/kifoku-disco-22606_512.gif') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
    }

    .hidden {
      display: none !important;
    }

    .box {
      background: rgba(24, 24, 24, 0.90);
      backdrop-filter: blur(8px);
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin: 20px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      padding: 10px;
      background: #1db954;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .control-btn {
      flex: 1;
      min-width: 110px;
      font-size: 0.85rem;
    }

    .active-mode {
      border: 2px solid #ffffff !important;
      background-color: #1abc9c !important;
      box-shadow: 0 0 8px #1db954;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-size: 0.80rem;
      text-align: center;
    }

    .bulk-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.80rem;
      background: #333;
      border: 1px solid #555;
      text-align: center;
    }

    .bulk-btn:hover {
      background: #444;
    }

    /* --- Display Studio Hi-Fi Pro --- */
    #now-playing-display {
      background: #09090c;
      border: 1px solid #222;
      border-top: 1px solid #333;
      border-radius: 8px;
      padding: 15px 18px;
      margin-bottom: 15px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.9), 0 4px 12px rgba(0,0,0,0.4);
    }
    
    .np-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .np-info {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 15px;
    }

    /* Titolo Canzone Stilizzato, in Corsivo con Colore Dinamico in Movimento */
    .np-title {
      font-size: 1.15rem;
      font-style: italic;
      font-weight: 800;
      margin: 0 0 4px 0;
      letter-spacing: 0.5px;
      background: linear-gradient(270deg, #1db954, #3498db, #9b59b6, #e74c3c, #1db954);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: all 0.3s ease;
    }

    .playing .np-title {
      animation: gradient-animation 6s ease infinite;
    }

    @keyframes gradient-animation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .np-artist {
      font-size: 0.85rem;
      color: #888;
      margin: 0;
      font-weight: 500;
    }

    /* LED di stato hardware */
    .status-led-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-led {
      width: 7px;
      height: 7px;
      background-color: #444;
      border-radius: 50%;
      box-shadow: 0 0 3px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .playing .status-led {
      background-color: #ff3333;
      box-shadow: 0 0 8px #ff3333, 0 0 12px #ff3333;
      animation: pulse-led 1s infinite alternate;
    }

    @keyframes pulse-led {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Equalizzatore Grafico a Spettro Avanzato (24 Barre Multi-Colore) */
    .spectrum-analyzer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 38px;
      padding: 4px 6px;
      background: #050507;
      border-radius: 4px;
      border: 1px solid #1a1a1f;
      overflow: hidden;
    }

    .spec-bar {
      width: 3.5px;
      background: #222;
      height: 4px;
      border-radius: 1px;
      transition: height 0.1s ease;
    }

    .playing .spec-bar {
      animation: spectrum-bounce 0.7s ease-in-out infinite alternate;
    }

    .playing .spec-bar:nth-child(1)  { background: #3498db; animation-duration: 0.4s; animation-delay: 0.05s; }
    .playing .spec-bar:nth-child(2)  { background: #3498db; animation-duration: 0.6s; animation-delay: 0.2s; }
    .playing .spec-bar:nth-child(3)  { background: #2ecc71; animation-duration: 0.3s; animation-delay: 0.1s; }
    .playing .spec-bar:nth-child(4)  { background: #2ecc71; animation-duration: 0.5s; animation-delay: 0.35s; }
    .playing .spec-bar:nth-child(5)  { background: #2ecc71; animation-duration: 0.45s; animation-delay: 0.15s; }
    .playing .spec-bar:nth-child(6)  { background: #2ecc71; animation-duration: 0.7s; animation-delay: 0.25s; }
    .playing .spec-bar:nth-child(7)  { background: #f1c40f; animation-duration: 0.35s; animation-delay: 0.08s; }
    .playing .spec-bar:nth-child(8)  { background: #f1c40f; animation-duration: 0.55s; animation-delay: 0.4s; }
    .playing .spec-bar:nth-child(9)  { background: #f1c40f; animation-duration: 0.48s; animation-delay: 0.12s; }
    .playing .spec-bar:nth-child(10) { background: #e67e22; animation-duration: 0.38s; animation-delay: 0.3s; }
    .playing .spec-bar:nth-child(11) { background: #e67e22; animation-duration: 0.62s; animation-delay: 0.02s; }
    .playing .spec-bar:nth-child(12) { background: #e67e22; animation-duration: 0.42s; animation-delay: 0.22s; }
    .playing .spec-bar:nth-child(13) { background: #e74c3c; animation-duration: 0.32s; animation-delay: 0.18s; }
    .playing .spec-bar:nth-child(14) { background: #e74c3c; animation-duration: 0.58s; animation-delay: 0.33s; }
    .playing .spec-bar:nth-child(15) { background: #e74c3c; animation-duration: 0.46s; animation-delay: 0.07s; }
    .playing .spec-bar:nth-child(16) { background: #e74c3c; animation-duration: 0.68s; animation-delay: 0.28s; }
    .playing .spec-bar:nth-child(17) { background: #9b59b6; animation-duration: 0.37s; animation-delay: 0.14s; }
    .playing .spec-bar:nth-child(18) { background: #9b59b6; animation-duration: 0.52s; animation-delay: 0.38s; }
    .playing .spec-bar:nth-child(19) { background: #9b59b6; animation-duration: 0.43s; animation-delay: 0.03s; }
    .playing .spec-bar:nth-child(20) { background: #3498db; animation-duration: 0.65s; animation-delay: 0.21s; }
    .playing .spec-bar:nth-child(21) { background: #2ecc71; animation-duration: 0.36s; animation-delay: 0.09s; }
    .playing .spec-bar:nth-child(22) { background: #f1c40f; animation-duration: 0.54s; animation-delay: 0.26s; }
    .playing .spec-bar:nth-child(23) { background: #e67e22; animation-duration: 0.41s; animation-delay: 0.16s; }
    .playing .spec-bar:nth-child(24) { background: #e74c3c; animation-duration: 0.49s; animation-delay: 0.31s; }

    @keyframes spectrum-bounce {
      0% { height: 4px; }
      50% { height: 22px; }
      100% { height: 34px; }
    }
  </style>
</head>
<body>

  <div class="box">
    <!-- Sezione Login -->
    <div id="login-box">
      <h2 style="color: #1db954; text-align: center; margin-top: 0;">Accesso Riservato</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()" style="width: 100%;">Accedi</button>
      <p id="error-msg" style="color: #ff4d4d; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- Sezione Player e Catalogo -->
    <div id="player-box" class="hidden">
      <!-- Intestazione Principale Accattivante e d'Effetto -->
      <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #1db954 0%, #1ed760 50%, #3498db 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 8px 0; letter-spacing: 0.5px; text-shadow: 0 2px 10px rgba(29,185,84,0.2);">
          🎧 Catalogo Musicale di Produzione Privata
        </h2>
        <div style="width: 60px; height: 3px; background: #1db954; margin: 0 auto 12px auto; border-radius: 2px; box-shadow: 0 0 8px #1db954;"></div>
        <p style="text-align: center; color: #ccc; margin-bottom: 20px;">
          <span style="display: block;">Benvenuto! Accesso autorizzato.</span>
          <span style="display: block;">L'ascolto è consentito solo agli utenti registrati ed autorizzati.</span>
          <span style="display: block;">La copia e la divulgazione sono assolutamente vietati.</span>
        </p>
      </div>

      <!-- 1. Menu a tendina per i filtri a cascata -->
      <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
        <select id="filter-language" onchange="updateGenres()">
          <option value="">Tutte le Lingue</option>
        </select>
        <select id="filter-genre" onchange="updateArtists()" disabled>
          <option value="">Tutti i Generi</option>
        </select>
        <select id="filter-artist" onchange="renderTracks()" disabled>
          <option value="">Tutti gli Artisti</option>
        </select>
        <!-- Filtro Tipo Brano visibile solo per Admin -->
        <select id="filter-tipo" class="hidden" onchange="renderTracks()">
          <option value="">Tutti i Tipi</option>
          <option value="pubblico">Pubblico</option>
          <option value="privato">Privato</option>
          <option value="user">User</option>
        </select>
      </div>

      <!-- 2. Pannello di Controllo Player -->
      <div style="margin-bottom: 15px; border: 1px solid #444; padding: 15px; border-radius: 6px; background: #222; box-shadow: 0 0 10px rgba(0,0,0,0.5);">
        <p style="font-size: 1.05rem; color: #1db954; font-weight: bold; margin: 0 0 12px 0; text-align: center; text-transform: uppercase; letter-spacing: 1px;">⚙️ Pannello di Controllo Player</p>
        
        <!-- Prima Riga: Modalità esclusive -->
        <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
          <button onclick="setMainMode('playAll')" id="btn-playAll" class="control-btn" style="background: #2c3e50;">▶ Play ALL</button>
          <button onclick="setMainMode('random')" id="btn-random" class="control-btn" style="background: #8e44ad;">🔀 Random</button>
          <button onclick="setMainMode('listaTop')" id="btn-listaTop" class="control-btn" style="background: #d35400;">⭐ Lista Top</button>
          <button onclick="setMainMode('repeat')" id="btn-repeat" class="control-btn" style="background: #16a085;">🔁 Repeat</button>
        </div>

        <!-- Seconda Riga: Comandi d'azione sui brani -->
        <div style="display: flex; gap: 6px;">
          <button onclick="stopAllTracks()" class="nav-btn" style="background: #e74c3c;">⏹ Stop</button>
          <button onclick="playPrevious()" class="nav-btn" style="background: #34495e;">⏮ Precedente</button>
          <button onclick="togglePlayPause()" id="btn-play-pause" class="nav-btn" style="background: #1db954;">▶ Play Song</button>
          <button onclick="playNext()" class="nav-btn" style="background: #34495e;">Successivo ⏭</button>
        </div>
      </div>

      <!-- Riquadro Display Studio Hi-Fi con Titolo in Corsivo Dinamico -->
      <div id="now-playing-display">
        <div class="np-top-row">
          <div class="np-info">
            <p id="np-title" class="np-title">In attesa di riproduzione</p>
            <p id="np-artist" class="np-artist">---</p>
          </div>
          <div class="status-led-box">
            <span>LIVE</span>
            <div class="status-led"></div>
          </div>
        </div>
        
        <!-- Spettro a 24 Barre -->
        <div id="eq-container" class="spectrum-analyzer">
          <div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div>
          <div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div>
          <div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div>
          <div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div>
          <div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div>
          <div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div><div class="spec-bar"></div>
        </div>
      </div>

      <!-- Controlli di Selezione Massiva -->
      <div id="bulk-controls" class="hidden" style="display: flex; gap: 8px; margin-bottom: 15px;">
        <button onclick="toggleAllCheckboxes(true)" class="bulk-btn">Seleziona Tutti</button>
        <button onclick="toggleAllCheckboxes(false)" class="bulk-btn">Deseleziona Tutti</button>
      </div>

      <!-- 3. Lista dei brani -->
      <div id="track-list"></div>

      <button onclick="logout()" style="width: 100%; background: #333; margin-top: 20px;">Esci</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://srymbehnppgvxjnithbj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TJ9gHfCbw09uNbT46xDByg_xluGQ1f6';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allTracks = [];
    let currentFilteredTracks = [];
    let currentMode = 'playAll'; 
    let userRole = 'user'; 

    let activeQueue = [];
    let currentQueueIndex = -1;
    let isPaused = false;

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      errorMsg.innerText = '';

      const { data: { user }, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.innerText = 'Credenziali non valide.';
        return;
      }

      const { data: profile, error: profileError } = await supabaseClient
        .from('profiles')
        .select('status, role')
        .eq('id', user.id)
        .single();

      if (profileError || !profile || profile.status !== 'approved') {
        errorMsg.innerText = 'Account non ancora approvato dall\'amministratore.';
        await supabaseClient.auth.signOut();
        return;
      }

      userRole = profile.role || 'user';

      if (userRole === 'admin') {
        document.getElementById('filter-tipo').classList.remove('hidden');
      } else {
        document.getElementById('filter-tipo').classList.add('hidden');
      }

      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('player-box').classList.remove('hidden');
      
      loadTracks();
    }

    async function loadTracks() {
      const trackList = document.getElementById('track-list');
      trackList.innerHTML = '<p>Caricamento brani...</p>';

      let query = supabaseClient.from('tracks').select('*');

      if (userRole !== 'admin') {
        query = query.eq('tipo', 'pubblico');
      }

      const { data: tracks, error } = await query.order('title', { ascending: true });

      if (error || !tracks || tracks.length === 0) {
        trackList.innerHTML = '<p style="color: #aaa; text-align: center;">Nessun brano disponibile per il tuo account.</p>';
        return;
      }

      allTracks = tracks;
      populateLanguages();
      renderTracks();
    }

    function populateLanguages() {
      const langSelect = document.getElementById('filter-language');
      const languages = [...new Set(allTracks.map(t => t.lingua).filter(Boolean))].sort();
      
      langSelect.innerHTML = '<option value="">Tutte le Lingue</option>';
      languages.forEach(lang => {
        langSelect.innerHTML += `<option value="${lang}">${lang}</option>`;
      });
      
      updateGenres();
    }

    function updateGenres() {
      const selectedLang = document.getElementById('filter-language').value;
      const genreSelect = document.getElementById('filter-genre');
      
      const filtered = selectedLang ? allTracks.filter(t => t.lingua === selectedLang) : allTracks;
      const genres = [...new Set(filtered.map(t => t.genere).filter(Boolean))].sort();

      genreSelect.innerHTML = '<option value="">Tutti i Generi</option>';
      genres.forEach(genre => {
        genreSelect.innerHTML += `<option value="${genre}">${genre}</option>`;
      });

      genreSelect.disabled = genres.length === 0;
      document.getElementById('filter-artist').innerHTML = '<option value="">Tutti gli Artisti</option>';
      document.getElementById('filter-artist').disabled = true;

      renderTracks();
    }

    function updateArtists() {
      const selectedLang = document.getElementById('filter-language').value;
      const selectedGenre = document.getElementById('filter-genre').value;
      const artistSelect = document.getElementById('filter-artist');
      
      let filtered = allTracks;
      if (selectedLang) filtered = filtered.filter(t => t.lingua === selectedLang);
      if (selectedGenre) filtered = filtered.filter(t => t.genere === selectedGenre);

      const artists = [...new Set(filtered.map(t => t.artista).filter(Boolean))].sort();

      artistSelect.innerHTML = '<option value="">Tutti gli Artisti</option>';
      artists.forEach(artist => {
        artistSelect.innerHTML += `<option value="${artist}">${artist}</option>`;
      });

      artistSelect.disabled = artists.length === 0;

      renderTracks();
    }

    function renderTracks() {
      const selectedLang = document.getElementById('filter-language').value;
      const selectedGenre = document.getElementById('filter-genre').value;
      const selectedArtist = document.getElementById('filter-artist').value;
      const selectedTipo = userRole === 'admin' ? document.getElementById('filter-tipo').value : '';
      
      const trackList = document.getElementById('track-list');
      const bulkControls = document.getElementById('bulk-controls');

      if (currentMode === 'listaTop' || currentMode === 'repeat') {
        bulkControls.classList.remove('hidden');
      } else {
        bulkControls.classList.add('hidden');
      }

      let filtered = allTracks;
      if (selectedLang) filtered = filtered.filter(t => t.lingua === selectedLang);
      if (selectedGenre) filtered = filtered.filter(t => t.genere === selectedGenre);
      if (selectedArtist) filtered = filtered.filter(t => t.artista === selectedArtist);
      if (selectedTipo) filtered = filtered.filter(t => t.tipo === selectedTipo);

      currentFilteredTracks = filtered;

      if (filtered.length === 0) {
        trackList.innerHTML = '<p style="color: #aaa; text-align: center;">Nessun brano corrisponde ai filtri selezionati.</p>';
        bulkControls.classList.add('hidden');
        return;
      }

      trackList.innerHTML = '';

      for (let i = 0; i < filtered.length; i++) {
        const track = filtered[i];
        const { data } = supabaseClient.storage.from('wish-music-75-files').getPublicUrl(track.file_key);

        let leftCheckboxHtml = '';
        if (currentMode === 'listaTop') {
          leftCheckboxHtml = `<label style="font-size: 0.8rem; color: #d35400; margin-right: 10px; cursor: pointer;"><input type="checkbox" class="track-checkbox" data-index="${i}" checked> Top</label>`;
        } else if (currentMode === 'repeat') {
          leftCheckboxHtml = `<label style="font-size: 0.8rem; color: #16a085; margin-right: 10px; cursor: pointer;"><input type="checkbox" class="track-checkbox" data-index="${i}" checked> Repeat</label>`;
        }

        const trackCard = document.createElement('div');
        trackCard.style.cssText = 'background: #2a2a2a; padding: 15px; border-radius: 6px; margin-bottom: 15px;';
        trackCard.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <div style="display: flex; align-items: center; gap: 8px; flex: 1;">
              ${leftCheckboxHtml}
              <h4 style="margin: 0; color: #ffffff; font-size: 1.1rem;">${track.title}</h4>
            </div>
            <span style="font-size: 0.75rem; background: #333; color: #1db954; padding: 2px 8px; border-radius: 10px;">${track.genere || 'Generico'} (${track.lingua || 'N/D'})</span>
          </div>
          <p style="margin: 0 0 8px 0; font-size: 0.85rem; color: #1db954; font-weight: bold;">${track.artista || 'Artista non specificato'}</p>
          <p style="margin: 0 0 10px 0; font-size: 0.85rem; color: #ccc;">${track.description || ''}</p>
          <audio controls controlsList="nodownload" oncontextmenu="return false;" style="width: 100%;" data-index="${i}" onplay="onManualPlay(${i})">
            <source src="${data.publicUrl}" type="audio/mpeg">
            Il tuo browser non supporta l'elemento audio.
          </audio>
        `;
        trackList.appendChild(trackCard);
      }
      updateModeUI();
    }

    function toggleAllCheckboxes(selectStatus) {
      const checkboxes = document.querySelectorAll('.track-checkbox');
      checkboxes.forEach(cb => {
        cb.checked = selectStatus;
      });
    }

    function setMainMode(mode) {
      currentMode = mode;
      renderTracks();
    }

    function updateModeUI() {
      const modes = ['playAll', 'random', 'listaTop', 'repeat'];
      modes.forEach(m => {
        const btn = document.getElementById(`btn-${m}`);
        if (btn) {
          if (currentMode === m) {
            btn.classList.add('active-mode');
          } else {
            btn.classList.remove('active-mode');
          }
        }
      });
    }

    function updateNowPlayingDisplay(track, isPlaying) {
      const titleEl = document.getElementById('np-title');
      const artistEl = document.getElementById('np-artist');
      const displayContainer = document.getElementById('now-playing-display');

      if (track && isPlaying) {
        titleEl.innerText = track.title;
        artistEl.innerText = track.artista || 'Artista non specificato';
        displayContainer.classList.add('playing');
      } else {
        titleEl.innerText = 'In attesa di riproduzione';
        artistEl.innerText = '---';
        displayContainer.classList.remove('playing');
      }
    }

    function onManualPlay(filteredIndex) {
      const audioElements = document.querySelectorAll('audio');
      audioElements.forEach((audio, idx) => {
        if (idx !== filteredIndex) audio.pause();
      });

      const track = currentFilteredTracks[filteredIndex];
      if (track) {
        isPaused = false;
        document.getElementById('btn-play-pause').innerText = '⏸ Pausa';
        updateNowPlayingDisplay(track, true);
      }
    }

    function stopAllTracks() {
      const audioElements = document.querySelectorAll('audio');
      audioElements.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
      });
      currentQueueIndex = -1;
      activeQueue = [];
      isPaused = false;
      document.getElementById('btn-play-pause').innerText = '▶ Play Song';
      updateNowPlayingDisplay(null, false);
    }

    function buildQueue() {
      const audioElements = Array.from(document.querySelectorAll('audio'));
      if (audioElements.length === 0) return [];

      let targetAudios = audioElements.filter(audio => {
        const index = audio.getAttribute('data-index');
        
        if (currentMode === 'listaTop' || currentMode === 'repeat') {
          const checkbox = document.querySelector(`.track-checkbox[data-index="${index}"]`);
          if (checkbox && !checkbox.checked) return false;
        }

        return true;
      });

      if (currentMode === 'random') {
        targetAudios.sort(() => Math.random() - 0.5);
      }

      return targetAudios;
    }

    function togglePlayPause() {
      if (activeQueue.length > 0 && currentQueueIndex >= 0 && currentQueueIndex < activeQueue.length) {
        const currentAudio = activeQueue[currentQueueIndex];
        const trackIndex = currentAudio.getAttribute('data-index');
        const track = currentFilteredTracks[trackIndex];

        if (!currentAudio.paused) {
          currentAudio.pause();
          isPaused = true;
          updateNowPlayingDisplay(track, false);
          document.getElementById('btn-play-pause').innerText = '▶ Riprendi';
        } else {
          currentAudio.play().then(() => {
            isPaused = false;
            updateNowPlayingDisplay(track, true);
            document.getElementById('btn-play-pause').innerText = '⏸ Pausa';
          }).catch(e => {
            console.log("Riproduzione bloccata:", e);
          });
        }
      } else {
        startPlaySong();
      }
    }

    function startPlaySong() {
      stopAllTracks();
      activeQueue = buildQueue();

      if (activeQueue.length === 0) {
        alert("Nessun brano idoneo trovato per la modalità corrente.");
        return;
      }

      currentQueueIndex = 0;
      playQueueIndex(currentQueueIndex);
    }

    function playQueueIndex(index) {
      if (index >= 0 && index < activeQueue.length) {
        const audioElements = document.querySelectorAll('audio');
        audioElements.forEach(audio => audio.pause());

        currentQueueIndex = index;
        const currentAudio = activeQueue[currentQueueIndex];
        const trackIndex = currentAudio.getAttribute('data-index');
        const track = currentFilteredTracks[trackIndex];

        isPaused = false;
        document.getElementById('btn-play-pause').innerText = '⏸ Pausa';
        updateNowPlayingDisplay(track, true);
        
        currentAudio.onended = function() {
          if (currentQueueIndex + 1 < activeQueue.length) {
            playQueueIndex(currentQueueIndex + 1);
          } else if (currentMode === 'repeat') {
            playQueueIndex(0);
          } else {
            isPaused = false;
            document.getElementById('btn-play-pause').innerText = '▶ Play Song';
            updateNowPlayingDisplay(null, false);
          }
        };

        currentAudio.play().catch(e => {
          console.log("Riproduzione bloccata dal browser:", e);
        });
      }
    }

    function playNext() {
      if (activeQueue.length === 0) {
        activeQueue = buildQueue();
      }
      if (activeQueue.length > 0) {
        let nextIndex = currentQueueIndex + 1;
        if (nextIndex >= activeQueue.length || nextIndex < 0) {
          nextIndex = 0;
        }
        playQueueIndex(nextIndex);
      }
    }

    function playPrevious() {
      if (activeQueue.length === 0) {
        activeQueue = buildQueue();
      }
      if (activeQueue.length > 0) {
        let prevIndex = currentQueueIndex - 1;
        if (prevIndex < 0) {
          prevIndex = activeQueue.length - 1;
        }
        playQueueIndex(prevIndex);
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      document.getElementById('login-box').classList.remove('hidden');
      document.getElementById('player-box').classList.add('hidden');
    }
  </script>
</body>
</html>
